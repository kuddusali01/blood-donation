<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>রক্তদান শিবির নিবন্ধন</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.banner img{
    width:100%;
    display:block;
    max-height:250px;
    object-fit:cover;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#c62828;
    margin-bottom:30px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

.star{
    color:red;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
    outline:none;
}

input:focus,
select:focus{
    border:1px solid #ccc;
}

.error{
    border:2px solid red !important;
}

button{
    width:100%;
    background:#c62828;
    color:white;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#b71c1c;
}

.checkbox-group{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:10px;
    margin-bottom:20px;
}

.checkbox-group input{
    width:auto;
    margin-top:5px;
}

.privacy-text{
    text-align:center;
    font-size:14px;
    color:#666;
    margin-top:15px;
    line-height:1.7;
}

.success-box{
    text-align:center;
    padding:50px 20px;
}

.success-circle{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#4CAF50;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:50px;
}

.success-title{
    font-size:30px;
    font-weight:bold;
    margin-top:20px;
}

.success-text{
    color:#555;
    margin-top:10px;
    margin-bottom:25px;
}

</style>
</head>

<body>

<div class="banner">
<img src="https://i.ibb.co/b5fqYmKX/IMG-20260606-030459.jpg" alt="Banner">
</div>

<div class="container">

<h2>রক্তদাতা নিবন্ধন ফর্ম</h2>

<form id="bloodForm">

<label>
Name <span class="star">*</span>
</label>
<input type="text" name="name" required>

<label>
Age <span class="star">*</span>
</label>

<select name="age" required>
<option value="">Select Age</option>
</select>

<label>
Gender <span class="star">*</span>
</label>

<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>
Phone Number <span class="star">*</span>
</label>

<input
type="tel"
name="phone"
placeholder="10 digit phone number"
pattern="[0-9]{10}"
maxlength="10"
required>

<label>
Email (Optional)
</label>

<input
type="email"
name="email"
placeholder="Enter email">

<label>
Address <span class="star">*</span>
</label>

<input
type="text"
name="address"
required>

<label>
Blood Group <span class="star">*</span>
</label>

<select name="bloodgroup" required>
<option value="">Select Blood Group</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>

<div class="checkbox-group">

<input
type="checkbox"
id="consent"
required>

<label for="consent">

আমি স্বেচ্ছায় রক্তদান কর্মসূচিতে অংশগ্রহণ করতে ইচ্ছুক এবং মানবিক প্রয়োজনে নিরাপদ রক্তদানের মাধ্যমে অসহায় মানুষের পাশে দাঁড়াতে ও প্রয়োজনে সহযোগিতা করতে সম্মত আছি।

</label>

</div>

<button type="submit" id="submitBtn">
Submit
</button>

<p class="privacy-text">

আপনার দেওয়া তথ্য শুধুমাত্র রক্তদান কর্মসূচি, জরুরি যোগাযোগ এবং প্রয়োজনে রক্তদাতা খোঁজার উদ্দেশ্যে সংরক্ষণ করা হবে। এই তথ্য অন্য কোনো ব্যক্তি বা প্রতিষ্ঠানের কাছে শেয়ার করা হবে না।

</p>

</form>

</div>

<script>

// Age dropdown
const ageSelect =
document.querySelector('select[name="age"]');

for(let i=18;i<=60;i++){
    let option =
    document.createElement("option");

    option.value=i;
    option.text=i;

    ageSelect.appendChild(option);
}

document
.getElementById('bloodForm')
.addEventListener('submit',
function(e){

e.preventDefault();

// Required field red highlight
document
.querySelectorAll(
'input[required], select[required]'
)
.forEach(field => {

if(!field.value){
field.classList.add('error');
}else{
field.classList.remove('error');
}

});

if(!this.checkValidity()){
this.reportValidity();
return;
}

const btn =
document.getElementById('submitBtn');

btn.innerText = "Submitting...";
btn.disabled = true;

// Duplicate phone block
const phone =
document.querySelector(
'input[name="phone"]'
).value;

const key =
"phone_" + phone;

if(localStorage.getItem(key)){

alert(
"❌ এই ফোন নম্বর দিয়ে আগে submit করা হয়েছে"
);

btn.innerText = "Submit";
btn.disabled = false;
return;
}

fetch(
'https://script.google.com/macros/s/AKfycbyLVZ-14Rik-k5032kL7qPO9a92m9xubMlLC8kxiI_m2VfxP5DEIY6bPJ0X7VdVCEW2/exec',
{
method:'POST',
body:new FormData(this)
})

.then(response =>
response.text())

.then(data => {

localStorage.setItem(
key,
"submitted"
);

document.querySelector(
'.container'
).innerHTML = `

<div class="success-box">

<div class="success-circle">
✓
</div>

<div class="success-title">
THANK YOU
</div>

<div class="success-text">
আপনার তথ্য সফলভাবে গ্রহণ করা হয়েছে
</div>

<button onclick="location.reload()">
Back Form
</button>

</div>
`;

})

.catch(() => {

alert(
"❌ সমস্যা হয়েছে, আবার চেষ্টা করুন"
);

btn.innerText = "Submit";
btn.disabled = false;

});

});

</script>

</body>
</html>
