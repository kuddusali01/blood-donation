<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>রক্তদান শিবির নিবন্ধন</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.banner img{
    width:100%;
    display:block;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#c62828;
    margin-bottom:30px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

.star{
    color:red;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

input:invalid,
select:invalid{
    border:2px solid red;
}

button{
    width:100%;
    background:#c62828;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#b71c1c;
}

.consent{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:20px;
}

.consent input{
    width:auto;
    margin-top:5px;
}

.success-box{
    text-align:center;
    padding:50px 20px;
}

.success-circle{
    width:90px;
    height:90px;
    background:#4CAF50;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:50px;
}

.success-title{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
}

.success-text{
    color:#555;
    margin-top:10px;
}

.back-btn{
    margin-top:25px;
}

</style>
</head>

<body>

<div class="banner">
<img src="https://i.ibb.co/b5fqYmKX/IMG-20260606-030459.jpg" alt="Banner">
</div>

<div class="container">

<h2>রক্তদাতা নিবন্ধন ফর্ম</h2>

<form id="bloodForm">

<label>
Name <span class="star">*</span>
</label>
<input type="text" name="name" required>

<label>
Age <span class="star">*</span>
</label>

<select name="age" required>
<option value="">Select Age</option>
<script>
for(let i=18;i<=60;i++){
document.write(`<option>${i}</option>`)
}
</script>
</select>

<label>
Gender <span class="star">*</span>
</label>

<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>
Phone Number <span class="star">*</span>
</label>

<input
type="tel"
name="phone"
pattern="[0-9]{10}"
maxlength="10"
placeholder="10 digit phone number"
required>

<label>
Email (Optional)
</label>

<input
type="email"
name="email"
placeholder="Enter email">

<label>
Address <span class="star">*</span>
</label>

<input
type="text"
name="address"
required>

<label>
Blood Group <span class="star">*</span>
</label>

<select name="bloodgroup" required>
<option value="">Select Blood Group</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>

<div class="consent">
<input type="checkbox" required>

<label>
আমি স্বেচ্ছায় রক্তদান কর্মসূচিতে অংশগ্রহণ করতে সম্মত।
</label>
</div>

<button type="submit" id="submitBtn">
Submit
</button>

</form>

</div>

<script>

const formHTML =
document.querySelector('.container').innerHTML;

document.getElementById('bloodForm')
.addEventListener('submit', function(e){

e.preventDefault();

if(!this.checkValidity()){
this.reportValidity();
return;
}

const btn =
document.getElementById('submitBtn');

btn.innerText = "Submitting...";
btn.disabled = true;

fetch('https://script.google.com/macros/s/AKfycbwg0vvSDQ0rrGSfNrPErIof1vHX9fZ7RNt85E0jyqg9_iuNSie6U_A5sLQLmKtQrnvl/exec', {
method:'POST',
body:new FormData(this)
})

.then(response => response.text())

.then(data => {

if(data === "duplicate"){
alert("❌ এই ফোন নম্বর দিয়ে আগে submit করা হয়েছে");
btn.innerText = "Submit";
btn.disabled = false;
return;
}

document.querySelector('.container')
.innerHTML = `

<div class="success-box">

<div class="success-circle">
✓
</div>

<div class="success-title">
THANK YOU
</div>

<div class="success-text">
Form has been successfully submitted
</div>

<button class="back-btn"
onclick="goBack()">
Back Form
</button>

</div>
`;

})

.catch(() => {

alert("❌ সমস্যা হয়েছে, আবার চেষ্টা করুন");

btn.innerText = "Submit";
btn.disabled = false;

});

});

function goBack(){
location.reload();
}

</script>

</body>
</html>
