<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রক্তদান শিবির নিবন্ধন</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.banner img{
    width:100%;
    display:block;
    max-height:250px;
    object-fit:cover;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#c62828;
    margin-bottom:30px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

.star{
    color:red;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

input:focus,
select:focus{
    border:2px solid #c62828;
    outline:none;
}

button{
    width:100%;
    background:#c62828;
    color:white;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#b71c1c;
}

.success-box{
    text-align:center;
    padding:50px 20px;
}

.success-circle{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#4CAF50;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:50px;
}

.success-title{
    font-size:30px;
    font-weight:bold;
    margin-top:20px;
}

.success-text{
    color:#555;
    margin-top:10px;
    margin-bottom:25px;
}

</style>
</head>

<body>

<div class="banner">
<img src="https://i.ibb.co/b5fqYmKX/IMG-20260606-030459.jpg" alt="Banner">
</div>

<div class="container">

<h2>রক্তদাতা নিবন্ধন ফর্ম</h2>

<form id="bloodForm">

<label>
Name <span class="star">*</span>
</label>
<input type="text" name="name" required>

<label>
Age <span class="star">*</span>
</label>

<select name="age" required>
<option value="">Select Age</option>
</select>

<label>
Gender <span class="star">*</span>
</label>

<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>
Phone Number <span class="star">*</span>
</label>

<input
type="tel"
name="phone"
pattern="[0-9]{10}"
maxlength="10"
placeholder="10 digit phone number"
required>

<label>
Email (Optional)
</label>

<input type="email" name="email">

<label>
Address <span class="star">*</span>
</label>

<input type="text" name="address" required>

<label>
Blood Group <span class="star">*</span>
</label>

<select name="bloodgroup" required>
<option value="">Select Blood Group</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>

<label>
<input type="checkbox" required>
আমি স্বেচ্ছায় রক্তদান করতে সম্মত।
</label>

<br><br>

<button type="submit" id="submitBtn">
Submit
</button>

</form>

</div>

<script>

// Age dropdown
const ageSelect =
document.querySelector('select[name="age"]');

for(let i=18;i<=60;i++){
    let option =
    document.createElement("option");
    option.value=i;
    option.text=i;
    ageSelect.appendChild(option);
}

document
.getElementById('bloodForm')
.addEventListener('submit',
function(e){

e.preventDefault();

if(!this.checkValidity()){
this.reportValidity();
return;
}

const btn =
document.getElementById('submitBtn');

btn.innerText = "Submitting...";
btn.disabled = true;

// Duplicate phone check
const phone =
document.querySelector(
'input[name="phone"]'
).value;

const key =
"phone_" + phone;

if(localStorage.getItem(key)){

alert(
"❌ এই ফোন নম্বর দিয়ে আগে submit করা হয়েছে"
);

btn.innerText = "Submit";
btn.disabled = false;
return;
}

fetch(
'https://script.google.com/macros/s/AKfycbyLVZ-14Rik-k5032kL7qPO9a92m9xubMlLC8kxiI_m2VfxP5DEIY6bPJ0X7VdVCEW2/exec',
{
method:'POST',
body:new FormData(this)
})

.then(response =>
response.text())

.then(data => {

localStorage.setItem(
key, "submitted"
);

document.querySelector(
'.container'
).innerHTML = `

<div class="success-box">

<div class="success-circle">
✓
</div>

<div class="success-title">
THANK YOU
</div>

<div class="success-text">
Form has been successfully submitted
</div>

<button onclick="location.reload()">
Back Form
</button>

</div>
`;

})

.catch(error => {

alert(
"❌ সমস্যা হয়েছে, আবার চেষ্টা করুন"
);

btn.innerText = "Submit";
btn.disabled = false;

});

});

</script>

</body>
</html>
