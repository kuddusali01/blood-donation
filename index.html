 <script>

const formHTML = document.querySelector('.container').innerHTML;

document.getElementById('bloodForm')
.addEventListener('submit', function(e){

e.preventDefault();

if(!this.checkValidity()){
this.reportValidity();
return;
}

const btn =
document.getElementById('submitBtn');

btn.innerText = "Submitting...";
btn.disabled = true;

fetch("https://script.google.com/macros/s/AKfycbwg0vvSDQ0rrGSfNrPErIof1vHX9fZ7RNt85E0jyqg9_iuNSie6U_A5sLQLmKtQrnvl/exec",{
method:"POST",
body:new FormData(this)
})

.then(response => response.text())

.then(data => {

if(data === "duplicate"){
alert("❌ এই ফোন নম্বর দিয়ে আগে submit করা হয়েছে");
btn.innerText = "Submit";
btn.disabled = false;
return;
}

document.querySelector('.container')
.innerHTML = `

<div class="success-box">

<div class="success-circle">
✓
</div>

<div class="success-title">
THANK YOU
</div>

<div class="success-text">
Form has been successfully submitted
</div>

<br>

<button onclick="goBack()">
Back Form
</button>

</div>
`;

})

.catch(error => {
alert("❌ সমস্যা হয়েছে, আবার চেষ্টা করুন");
btn.innerText = "Submit";
btn.disabled = false;
});

});

function goBack(){

document.querySelector('.container')
.innerHTML = formHTML;

location.reload();

}

 </script>
